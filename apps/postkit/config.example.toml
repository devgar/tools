# CLI config example. Copy to ~/.config/postkit/config.toml and fill in your credentials.

# ─── App credentials (shared across accounts of the same provider) ─────────────

# [apps.my_x_app]
# provider   = "x"
# api_key    = "consumer_key"
# api_secret = "consumer_secret"

# [apps.my_meta_app]
# provider = "meta"
# app_id     = "..."   # optional; needed for Meta token rotation
# app_secret = "..."

# ─── Accounts ─────────────────────────────────────────────────────────────────

# Bluesky — self-contained, no app entry needed.
# Use an app password from https://bsky.app/settings/app-passwords,
# never your main account password.
[accounts.mybsky]
provider     = "bluesky"
handle       = "you.bsky.social"
app_password = "xxxx-xxxx-xxxx-xxxx"

# Second Bluesky account
# [accounts.project_bsky]
# provider     = "bluesky"
# handle       = "project.bsky.social"
# app_password = "yyyy-yyyy-yyyy-yyyy"

# X (Twitter) — references [apps.my_x_app]
# [accounts.myx]
# provider             = "x"
# app                  = "my_x_app"
# access_token         = "..."
# access_token_secret  = "..."

# Second X account under the same app
# [accounts.company_x]
# provider             = "x"
# app                  = "my_x_app"
# access_token         = "..."
# access_token_secret  = "..."

# Facebook Page — references [apps.my_meta_app]
# [accounts.myfbpage]
# provider          = "facebook_page"
# app               = "my_meta_app"
# page_id           = "123456789012345"
# page_access_token = "EAA..."

# Instagram Business/Creator (connected to a Facebook Page)
# Note: posts require a public URL in the `url` field of each media item.
# [accounts.myig]
# provider     = "instagram"
# app          = "my_meta_app"
# ig_user_id   = "123456789012345"
# access_token = "EAA..."

# ─── Daemon connection ────────────────────────────────────────────────────────

# Used by `postkit schedule` and `postkit draft`.
# Defaults to http://localhost:8080 if omitted.
# daemon_url     = "http://localhost:8080"
# daemon_api_key = "changeme"
